<!doctype html>
<html lang="en">

<head>
	<title>index | basics</title>
	<link rel="stylesheet" href="style.css" />
</head>

<body style="background-color: blue;;">
	<h2>simple table</h2>

	<br /><br /><br />
	<div>
		<table>
			<thead>
				<tr>
					<th id="tar" class="target" colspan="2" rowspan="2">Name</th>
					<th colspan="2">Languages</th>
					<th colspan="2">Date of Birth</th>
				</tr>
			</thead>
			<tbody>
				<tr>
					<td colspan="2">Arun Lodhi</td>
					<td colspan="2">HTML</td>
					<td colspan="2">12-12-2001</td>
				</tr>
				<tr>
					<td colspan="2">Bhavana Kashyap</td>
					<td colspan="2">CSS</td>
					<td colspan="2">13-03-2003</td>
				</tr>
				<tr>
					<td colspan="2">Anjali Singh</td>
					<td colspan="2">JS</td>
					<td colspan="2">09-09-2001</td>
				</tr>
			</tbody>
			<tfoot>
				<tr>
					<td colspan="2">null</td>
					<td colspan="2">null</td>
					<td colspan="2">null</td>
				</tr>
			</tfoot>
		</table>
	</div>
</body>

</html>
